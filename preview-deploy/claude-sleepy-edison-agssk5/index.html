<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canyon Explorer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23c86a2e'/%3E%3Cpath d='M0 70 L30 35 L50 60 L70 25 L100 65 L100 100 L0 100 Z' fill='%238a3a1e'/%3E%3Ccircle cx='75' cy='25' r='12' fill='%23ffd89a'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1410;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas#canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      #hud {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      #hud > * {
        pointer-events: auto;
      }
      .panel {
        background: rgba(30, 22, 16, 0.72);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 200, 140, 0.25);
        border-radius: 10px;
        padding: 10px 12px;
        color: #f5e6d3;
        box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      }
      #title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin: 0 0 2px 0;
      }
      #subtitle {
        font-size: 11px;
        opacity: 0.75;
        margin: 0;
      }
      #locations {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 320px;
      }
      .loc-btn {
        background: rgba(90, 60, 30, 0.55);
        border: 1px solid rgba(255, 200, 140, 0.35);
        color: #f5e6d3;
        border-radius: 7px;
        padding: 7px 10px;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      .loc-btn:hover {
        background: rgba(200, 120, 50, 0.55);
      }
      .loc-btn.active {
        background: rgba(230, 140, 50, 0.85);
        border-color: rgba(255, 220, 170, 0.8);
        color: #241505;
        font-weight: 700;
      }
      #status {
        font-size: 11px;
        opacity: 0.85;
        min-height: 14px;
      }
      #help {
        font-size: 11px;
        line-height: 1.5;
        opacity: 0.8;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #2a1c10 0%, #140d08 100%);
        color: #f5e6d3;
        font-size: 14px;
        z-index: 20;
        transition: opacity 0.4s ease;
        flex-direction: column;
        gap: 10px;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(255,180,100,0.25);
        border-top-color: #ffb060;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="/preview-build/preview-deploy/claude-sleepy-edison-agssk5/assets/index-CsikzjeX.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="hud">
        <div class="panel">
          <p id="title">Canyon Explorer</p>
          <p id="subtitle">Real-world terrain, stylized rendering</p>
        </div>
        <div class="panel" id="locations"></div>
        <!-- "Classic View" backup toggle (see scene/sky.ts, terrain/locations.ts's
             LocationPreset.classicView, and main.ts). Hidden by default and only shown for a
             location whose default view has a golden-hour atmosphere variant with a classic
             backup to switch to (currently just Grand Canyon). -->
        <div class="panel" id="classic-view-panel" style="display: none;">
          <button id="classic-view-toggle" class="loc-btn">Classic View</button>
        </div>
        <div class="panel">
          <div id="status">Ready</div>
          <div id="help">Drag to look &bull; WASD to move &bull; Scroll / Shift to change speed</div>
        </div>
      </div>
      <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Fetching elevation data&hellip;</div>
      </div>
    </div>
  </body>
</html>
